<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1151 資安科技與管理</title>
    <meta
      name="description"
      content="1151 資安科技與管理課程網站，整理資料目錄與 README 內容。"
    />
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --panel-alt: #eef3ff;
        --primary: #1e3a8a;
        --primary-strong: #102a68;
        --secondary: #0ea5e9;
        --accent: #22c55e;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #dfe7f3;
        --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", "Noto Sans TC", system-ui, -apple-system, sans-serif;
        background: linear-gradient(180deg, #edf4ff 0%, #f8fafc 18%, var(--bg) 100%);
        color: var(--text);
        line-height: 1.7;
      }

      a {
        color: var(--primary);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 20px 80px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 18px 0 14px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 28px;
      }

      .brand {
        font-weight: 800;
        font-size: 1.4rem;
        letter-spacing: 0.04em;
        color: var(--primary-strong);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(30, 58, 138, 0.08);
        border: 1px solid rgba(30, 58, 138, 0.14);
        color: var(--primary-strong);
        font-size: 0.8rem;
        font-weight: 700;
      }

      .grid {
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr);
        gap: 28px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: var(--shadow);
      }

      .sidebar {
        padding: 20px 18px 18px;
        position: sticky;
        top: 20px;
        align-self: start;
        overflow: hidden;
      }

      .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 10px;
        margin-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }

      .sidebar-title {
        font-weight: 800;
        font-size: 1.08rem;
        color: var(--primary-strong);
      }

      .file-count {
        font-size: 0.78rem;
        color: var(--muted);
        background: #f3f4f6;
        border-radius: 999px;
        padding: 5px 9px;
      }

      .tree {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .tree-item {
        margin: 6px 0;
      }

      .tree-item > a,
      .tree-item > .folder-toggle {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 9px 10px;
        border-radius: 10px;
        color: var(--text);
        transition: background 0.2s ease, transform 0.2s ease;
      }

      .tree-item > a:hover,
      .tree-item > .folder-toggle:hover {
        background: var(--panel-alt);
        text-decoration: none;
        transform: translateX(1px);
      }

      .folder-toggle {
        cursor: pointer;
        font-weight: 650;
        border: none;
        background: transparent;
        text-align: left;
      }

      .tree-item .icon {
        width: 18px;
        text-align: center;
        flex-shrink: 0;
      }

      .tree-item .meta {
        font-size: 0.78rem;
        color: var(--muted);
        margin-left: auto;
      }

      .folder-children {
        list-style: none;
        padding-left: 18px;
        margin: 4px 0 0;
        border-left: 1px solid var(--border);
      }

      .hidden {
        display: none;
      }

      .content {
        padding: 24px 26px 26px;
      }

      .content h1,
      .content h2,
      .content h3,
      .content h4,
      .content h5,
      .content h6 {
        color: var(--primary-strong);
        line-height: 1.35;
        margin-top: 1.7em;
        margin-bottom: 0.7em;
      }

      .content h1 {
        font-size: clamp(2rem, 3.5vw, 2.7rem);
        margin-top: 0;
      }

      .content h2 {
        border-bottom: 2px solid var(--border);
        padding-bottom: 8px;
      }

      .content p,
      .content li,
      .content td,
      .content th {
        color: var(--text);
        font-size: 1rem;
      }

      .content ul,
      .content ol {
        padding-left: 1.6rem;
      }

      .content code {
        font-family: Consolas, "Courier New", monospace;
        background: #f3f4f6;
        padding: 0.15em 0.4em;
        border-radius: 6px;
        font-size: 0.92em;
      }

      .content pre {
        background: #0f172a;
        color: #e2e8f0;
        padding: 1rem 1.1rem;
        border-radius: 12px;
        overflow-x: auto;
      }

      .content table {
        width: 100%;
        border-collapse: collapse;
        margin: 1em 0;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }

      .content th,
      .content td {
        border-bottom: 1px solid var(--border);
        padding: 10px 12px;
        text-align: left;
      }

      .content th {
        background: #f8fafc;
      }

      .content blockquote {
        margin: 1.5em 0;
        padding: 0.9rem 1rem;
        border-left: 4px solid var(--secondary);
        background: #f1f9ff;
        border-radius: 0 10px 10px 0;
        color: #1e3a5f;
      }

      .footer-note {
        text-align: center;
        margin-top: 30px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <div class="brand">1151 資安科技與管理</div>
        <span class="badge">GitHub Pages</span>
      </header>

      <main class="grid">
        <aside class="panel sidebar">
          <div class="sidebar-header">
            <div class="sidebar-title">網站目錄</div>
            <span class="file-count" id="fileCount">0 項</span>
          </div>
          <ul class="tree" id="repoTree"></ul>
        </aside>

        <section class="panel content">
          <div id="readme"></div>
        </section>
      </main>

      <div class="footer-note">資料目錄會自動從 GitHub 倉庫同步，新增檔案後可直接更新顯示。</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      const repoOwner = "cjs930";
      const repoName = "Information-Security-Technology-Management";
      const siteBase = `https://cjs930.github.io/${repoName}/`;
      const apiBase = `https://api.github.com/repos/${repoOwner}/${repoName}`;

      async function fetchGitHubContents(path = "") {
        const url = `${apiBase}/contents/${path}`;
        const response = await fetch(url, {
          headers: {
            Accept: "application/vnd.github+json",
          },
        });

        if (!response.ok) {
          throw new Error(`Failed to fetch ${path}: ${response.status}`);
        }

        return response.json();
      }

      function getHref(item) {
        const itemPath = encodeURIComponent(item.path).replace(/%2F/g, "/");
        if (item.type === "dir") {
          return `${siteBase}${item.path}/`;
        }
        return `${siteBase}${item.path}`;
      }

      function createTreeItem(item) {
        const li = document.createElement("li");
        li.className = "tree-item";

        if (item.type === "dir") {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "folder-toggle";
          button.innerHTML = `
            <span class="icon">📁</span>
            <span>${item.name}</span>
            <span class="meta">資料夾</span>
          `;

          const children = document.createElement("ul");
          children.className = "folder-children hidden";
          button.addEventListener("click", async () => {
            const isHidden = children.classList.toggle("hidden");
            button.setAttribute("aria-expanded", String(!isHidden));
            if (!isHidden && children.childElementCount === 0) {
              try {
                const items = await fetchGitHubContents(item.path);
                items
                  .filter((child) => child.name !== ".git")
                  .sort((a, b) => a.type.localeCompare(b.type) || a.name.localeCompare(b.name))
                  .forEach((child) => {
                    children.appendChild(createTreeNode(child));
                  });
              } catch (error) {
                children.innerHTML = '<li class="tree-item"><span class="icon">⚠️</span> 無法載入資料夾</li>';
              }
            }
          });

          li.appendChild(button);
          li.appendChild(children);
          return li;
        }

        const link = document.createElement("a");
        link.href = getHref(item);
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.innerHTML = `
          <span class="icon">${item.name.toLowerCase().endsWith(".pdf") ? "📄" : item.name.toLowerCase().endsWith(".md") ? "📝" : "📎"}</span>
          <span>${item.name}</span>
          <span class="meta">${item.type === "file" ? "檔案" : "資料夾"}</span>
        `;
        li.appendChild(link);
        return li;
      }

      function createTreeNode(item) {
        return createTreeItem(item);
      }

      async function loadRepoTree() {
        const treeRoot = document.getElementById("repoTree");
        try {
          const rootEntries = await fetchGitHubContents();
          const children = rootEntries
            .filter((item) => item.name !== ".git")
            .sort((a, b) => a.type.localeCompare(b.type) || a.name.localeCompare(b.name));

          treeRoot.innerHTML = "";
          children.forEach((item) => treeRoot.appendChild(createTreeNode(item)));
          document.getElementById("fileCount").textContent = `${children.length} 項`;
        } catch (error) {
          treeRoot.innerHTML = "<li class='tree-item'><span class='icon'>⚠️</span> 無法載入 GitHub 倉庫目錄</li>";
        }
      }

      async function loadReadme() {
        const readmeContainer = document.getElementById("readme");
        try {
          const response = await fetch(`https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/README.md`);
          if (!response.ok) {
            throw new Error("README not found");
          }
          const markdown = await response.text();
          readmeContainer.innerHTML = marked.parse(markdown);
        } catch (error) {
          readmeContainer.innerHTML = `
            <h1>README</h1>
            <p>目前無法直接載入 README.md，請確認 GitHub 儲存庫內容已上傳。</p>
          `;
        }
      }

      document.addEventListener("DOMContentLoaded", async () => {
        await loadRepoTree();
        await loadReadme();
      });
    </script>
  </body>
</html>
